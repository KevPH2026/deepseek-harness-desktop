name: Release (Desktop)

# Manually triggered: choose an existing vSemVer tag, e.g. v0.1.0-beta.3.
# Apple Developer ID signing/notarization is intentionally NOT done here:
# the desktop shell is unsigned, opens via right-click -> Open the first
# time, and the release notes document that workaround. When you connect
# a Developer ID to the repo's secrets, the same workflow will start
# signing/notarizing automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vSemVer tag to release (for example v0.1.0-beta.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  release:
    name: Build and publish unsigned macOS arm64
    runs-on: macos-15
    environment: desktop-release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Verify tag
        run: |
          expected="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "Release tag $RELEASE_TAG does not match desktop package version $expected" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "$RELEASE_TAG^{commit}" >/dev/null; then
            echo "Release tag does not exist: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build and stage unsigned desktop distribution
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: |
          npm run build
          npm run build:desktop
          npm run desktop:icon:mac
          npm run desktop:stage
          rm -f apps/desktop/release/*.dmg apps/desktop/release/*.zip apps/desktop/release/*.blockmap
          npm exec --prefix apps/desktop -- electron-builder --projectDir apps/desktop \
            --mac dmg zip --arm64 \
            --config electron-builder.yml --publish never \
            -c.mac.identity=null -c.mac.hardenedRuntime=false

      - name: Publish GitHub Release (unsigned prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          notes="$(mktemp)"
          {
            echo "## DeepSeek Harness Desktop $version"
            echo
            echo "> [!WARNING]"
            echo "> This build is **unsigned** and **not notarized** because the"
            echo "> repository does not have Apple Developer ID credentials"
            echo "> configured. macOS will warn that the developer cannot be"
            echo "> verified on first open. Either right-click the app and"
            echo "> choose Open, or run"
            echo "> \`xattr -cr \"/Applications/DeepSeek Harness Desktop.app\"\`"
            echo "> once. A signed release will replace this build as soon as"
            echo "> an Apple Developer ID is connected to the GitHub repository"
            echo "> secrets."
            echo
            cat apps/desktop/CHANGELOG.md
          } > "$notes"
          # Re-running the workflow on the same tag must be idempotent.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Tag is immutable once a release exists, so recreate the release
            # by deleting it first (which keeps the git tag in place) and
            # uploading the fresh artifacts.
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag=false
          fi
          gh release create "$RELEASE_TAG" \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*.zip \
            apps/desktop/release/*.blockmap \
            apps/desktop/release/latest-mac.yml \
            --verify-tag \
            --title "DeepSeek Harness Desktop $version" \
            --notes-file "$notes" \
            --prerelease
